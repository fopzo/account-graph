<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>account_graph — регистрации</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2a2e3c;
      --text: #e6e8ee;
      --muted: #8b90a0;
      --accent: #6c8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    select, input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      min-width: 130px;
    }
    .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 8px; }
    .stat .num { font-size: 24px; font-weight: 700; }
    .stat .lbl { font-size: 12px; color: var(--muted); }
    .chart-box { height: 460px; }
    .btns { display: flex; gap: 8px; }
    button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .loading { color: var(--muted); padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">загрузка…</div></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const {
      ResponsiveContainer, ComposedChart, BarChart, LineChart, AreaChart,
      Bar, Line, Area, XAxis, YAxis, CartesianGrid, Tooltip, Legend
    } = Recharts;

    const CSV_URL = "account_graph.csv";
    const PER_ROW = 50000; // 1 строка = 50 000 аккаунтов

    const fmt = (n) => n.toLocaleString("ru-RU");
    const fmtShort = (n) => {
      if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
      return String(n);
    };
    const tipFmt = (v) => [fmt(v), "аккаунтов"];

    function App() {
      const [rows, setRows] = useState(null); // [{id, date, year, month}]
      const [error, setError] = useState(null);

      // filters
      const [granularity, setGranularity] = useState("month"); // month | year
      const [chartType, setChartType] = useState("bar");        // bar | line | area
      const [yearFrom, setYearFrom] = useState("all");
      const [yearTo, setYearTo] = useState("all");
      const [cumulative, setCumulative] = useState(false);

      useEffect(() => {
        Papa.parse(CSV_URL, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: (res) => {
            try {
              const parsed = res.data
                .filter(r => r.RegistrationDate)
                .map(r => {
                  const d = r.RegistrationDate.trim();
                  return {
                    id: r.ID,
                    date: d,
                    year: d.slice(0, 4),
                    month: d.slice(0, 7),
                  };
                });
              setRows(parsed);
            } catch (e) {
              setError(String(e));
            }
          },
          error: (e) => setError(String(e)),
        });
      }, []);

      const years = useMemo(() => {
        if (!rows) return [];
        return [...new Set(rows.map(r => r.year))].sort();
      }, [rows]);

      const filtered = useMemo(() => {
        if (!rows) return [];
        const lo = yearFrom === "all" ? "0000" : yearFrom;
        const hi = yearTo === "all" ? "9999" : yearTo;
        return rows.filter(r => r.year >= lo && r.year <= hi);
      }, [rows, yearFrom, yearTo]);

      const chartData = useMemo(() => {
        if (!filtered.length) return [];
        const keyOf = r => granularity === "year" ? r.year : r.month;
        const map = new Map();
        for (const r of filtered) {
          const k = keyOf(r);
          map.set(k, (map.get(k) || 0) + 1);
        }
        let arr = [...map.entries()]
          .sort((a, b) => a[0] < b[0] ? -1 : 1)
          .map(([label, rowsCount]) => ({ label, rows: rowsCount, count: rowsCount * PER_ROW }));

        if (cumulative) {
          let run = 0;
          arr = arr.map(d => { run += d.count; return { ...d, count: run }; });
        }
        return arr;
      }, [filtered, granularity, cumulative]);

      const total = filtered.length * PER_ROW;
      const uniqueIds = useMemo(
        () => filtered.length ? new Set(filtered.map(r => r.id)).size : 0,
        [filtered]
      );
      const peak = useMemo(() => {
        if (!chartData.length || cumulative) return null;
        return chartData.reduce((a, b) => b.count > a.count ? b : a);
      }, [chartData, cumulative]);

      if (error) return <div className="wrap"><div className="panel">Ошибка: {error}</div></div>;
      if (!rows) return <div className="wrap"><div className="loading">загрузка CSV…</div></div>;

      const yearOptions = ["all", ...years];

      return (
        <div className="wrap">
          <h1>account_graph — регистрации</h1>
          <div className="sub">Источник: account_graph.csv · строк: {rows.length} · 1 строка = {fmt(PER_ROW)} аккаунтов</div>

          <div className="panel">
            <div className="filters">
              <div className="field">
                <label>Группировка</label>
                <div className="btns">
                  <button className={granularity === "month" ? "active" : ""} onClick={() => setGranularity("month")}>по месяцам</button>
                  <button className={granularity === "year" ? "active" : ""} onClick={() => setGranularity("year")}>по годам</button>
                </div>
              </div>

              <div className="field">
                <label>Тип графика</label>
                <div className="btns">
                  <button className={chartType === "bar" ? "active" : ""} onClick={() => setChartType("bar")}>bar</button>
                  <button className={chartType === "line" ? "active" : ""} onClick={() => setChartType("line")}>line</button>
                  <button className={chartType === "area" ? "active" : ""} onClick={() => setChartType("area")}>area</button>
                </div>
              </div>

              <div className="field">
                <label>Год от</label>
                <select value={yearFrom} onChange={e => setYearFrom(e.target.value)}>
                  {yearOptions.map(y => <option key={y} value={y}>{y === "all" ? "все" : y}</option>)}
                </select>
              </div>

              <div className="field">
                <label>Год до</label>
                <select value={yearTo} onChange={e => setYearTo(e.target.value)}>
                  {yearOptions.map(y => <option key={y} value={y}>{y === "all" ? "все" : y}</option>)}
                </select>
              </div>

              <div className="field">
                <label>Накопительно</label>
                <div className="btns">
                  <button className={cumulative ? "active" : ""} onClick={() => setCumulative(c => !c)}>
                    {cumulative ? "вкл" : "выкл"}
                  </button>
                </div>
              </div>
            </div>

            <div className="stats">
              <div className="stat"><div className="num">{fmt(total)}</div><div className="lbl">аккаунтов в выборке</div></div>
              <div className="stat"><div className="num">{fmt(uniqueIds)}</div><div className="lbl">строк (уникальных ID)</div></div>
              {peak && <div className="stat"><div className="num">{fmt(peak.count)}</div><div className="lbl">пик ({peak.label})</div></div>}
            </div>
          </div>

          <div className="panel chart-box">
            <ResponsiveContainer width="100%" height="100%">
              {chartType === "bar" ? (
                <BarChart data={chartData} margin={{ top: 10, right: 20, left: 0, bottom: 40 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#2a2e3c" />
                  <XAxis dataKey="label" stroke="#8b90a0" angle={-45} textAnchor="end" height={60} interval="preserveStartEnd" />
                  <YAxis stroke="#8b90a0" width={70} tickFormatter={fmtShort} />
                  <Tooltip formatter={tipFmt} contentStyle={{ background: "#1a1d27", border: "1px solid #2a2e3c", borderRadius: 8 }} />
                  <Legend />
                  <Bar dataKey="count" name="аккаунты" fill="#6c8cff" radius={[4,4,0,0]} />
                </BarChart>
              ) : chartType === "line" ? (
                <LineChart data={chartData} margin={{ top: 10, right: 20, left: 0, bottom: 40 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#2a2e3c" />
                  <XAxis dataKey="label" stroke="#8b90a0" angle={-45} textAnchor="end" height={60} interval="preserveStartEnd" />
                  <YAxis stroke="#8b90a0" width={70} tickFormatter={fmtShort} />
                  <Tooltip formatter={tipFmt} contentStyle={{ background: "#1a1d27", border: "1px solid #2a2e3c", borderRadius: 8 }} />
                  <Legend />
                  <Line type="monotone" dataKey="count" name="аккаунты" stroke="#6c8cff" strokeWidth={2} dot={false} />
                </LineChart>
              ) : (
                <AreaChart data={chartData} margin={{ top: 10, right: 20, left: 0, bottom: 40 }}>
                  <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="5%" stopColor="#6c8cff" stopOpacity={0.6} />
                      <stop offset="95%" stopColor="#6c8cff" stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid strokeDasharray="3 3" stroke="#2a2e3c" />
                  <XAxis dataKey="label" stroke="#8b90a0" angle={-45} textAnchor="end" height={60} interval="preserveStartEnd" />
                  <YAxis stroke="#8b90a0" width={70} tickFormatter={fmtShort} />
                  <Tooltip formatter={tipFmt} contentStyle={{ background: "#1a1d27", border: "1px solid #2a2e3c", borderRadius: 8 }} />
                  <Legend />
                  <Area type="monotone" dataKey="count" name="аккаунты" stroke="#6c8cff" fill="url(#g)" strokeWidth={2} />
                </AreaChart>
              )}
            </ResponsiveContainer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
